
# Model architecture
model:
  name: SEDDPerturbationTransformerSmall
  hidden_dim: 256
  num_layers: 8
  num_heads: 8
  dropout: 0.1

# Data parameters
data:
  train_data_path: null  # set via CLI: /workspace/data/k562_essential_processed.h5ad
  gene: gene             # obs column with perturbation labels (Replogle K562)
  control_name: non-targeting
  val_fraction: 0.1
  loader_path: null
  cond_labels_pt_path: null  # no protein embeddings for K562 run
  all_perturbations_file: null
  data_path: null

# Training hyperparameters
training:
  batch_size: 512  # Max safe: 192, Conservative: 128 (for 97GB GPU with 8.5k context)
  num_epochs: 100
  learning_rate: 1.0e-4
  weight_decay: 0.01
  mask_ratio: 0.15
  gradient_clip: 1.0
  optimizer:
    type: AdamW
    betas: [0.9, 0.999]
  # Mixed precision training
  use_amp: true
  #able automatic mixed precision
  amp_dtype: bfloat16  # Options: bfloat16, float16

# Checkpoint and logging
checkpointing:
  checkpoint_dir: experiments/pbmc6_512_128
  save_interval: 2
  resume: null # Path to checkpoint to resume from

logging:
  log_interval: 2
  val_interval: 1

# Inference parameters
inference:
  mask_ratio: 0.2
  num_steps: 100
  temperature: 1.0
  sampler: euler
  batch_size: 512
  num_batches: null
  num_cells_visualize: 3
  perturbations_file: null      # set via CLI
  perturbations_all_file: null  # set via CLI
  num_samples_per_pert: 100
  cell_type: null



# Other parameters
other:
  seed: 42
  num_workers: 16

# Diffusion-specific parameters
diffusion:
  noise_schedule: LogLinearNoise
  noise_eps: 1.0e-3
  graph_type: AbsorbingGraph